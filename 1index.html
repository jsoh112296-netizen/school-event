<!-- 4. 앱 디자인 (CSS) -->
<style>
  body {
    font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    background-color: #f0f8ff;
    display: flex;
    justify-content: center;

  .app-container {
    background-color: white;
    width: 100%;

  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-content {
    background: white; padding: 20px; border-radius: 10px; text-align: center; width: 80%; max-width: 300px;
  }
</style>

<!-- 5. 앱 로직 (React JSX) -->
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  const describeError = (err) => {
    const code = err && err.code ? err.code : 'unknown';
    const hints = {
      'permission-denied': 'Firebase에서 요청을 거절했습니다. 게시된 Firestore 규칙과 App Check 설정을 확인해 주세요.',
      'unavailable': '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.',
      'unauthenticated': 'Firebase 인증이 필요합니다. 인증 설정과 규칙을 확인해 주세요.',
      'resource-exhausted': 'Firebase 사용량 한도를 확인해 주세요.',
      'invalid-argument': '저장할 데이터나 Firebase 설정을 확인해 주세요.'
    };
    return (hints[code] || '오류 내용을 선생님께 보여 주세요.') + '\n오류 코드: ' + code + '\n' + (err && err.message ? err.message : String(err));
  };
  const ErrorNotice = ({ message }) => message ? (
    <div role="alert" style={{whiteSpace:'pre-wrap', overflowWrap:'anywhere', textAlign:'left', color:'#b71c1c', background:'#ffebee', padding:12, borderRadius:8, marginTop:12}}>{message}</div>
  ) : null;


  // --- 1. 공통 커스텀 모달 ---
  const CustomModal = ({ isOpen, title, inputType, onSubmit, onClose }) => {
    const [inputValue, setInputValue] = useState('');
    const [errorMsg, setErrorMsg] = useState('');

    if (!isOpen) return null;

    const handleSubmit = () => {
      if (inputValue === '1234') { 
        onSubmit();
        setInputValue('');
        setErrorMsg('');
      } else {
        setErrorMsg('비밀번호가 틀렸습니다.');
      }
    };

    return (
      <div className="modal-overlay">
        <div className="modal-content">
          <h3>{title}</h3>
          <input 
            type={inputType || "text"} 
            value={inputValue}
            onChange={(e) => setInputValue(e.target.value)}
            placeholder="비밀번호 입력"
          />
          {errorMsg && <p style={{color: 'red'}}>{errorMsg}</p>}
          <button onClick={handleSubmit}>확인</button>
          <button onClick={onClose}>취소</button>
        </div>
      </div>
    );
  };

  // --- 2. 잠금 화면 ---
  const AppLockScreen = ({ onStudentUnlock, onTeacherUnlock }) => {
    const [password, setPassword] = useState('');
    const [error, setError] = useState('');
    const [isTeacherModalOpen, setIsTeacherModalOpen] = useState(false);
    const [isEntering, setIsEntering] = useState(false);
    const entryBusy = useRef(false);

    const handleStudentSubmit = async () => {
      if (entryBusy.current) return;
      if (password !== '0420') {
        setError('비밀번호가 틀렸습니다. (힌트: 장애인의 날 4자리)');
        return;
      }
      entryBusy.current = true;
      setIsEntering(true);
      setError('');
      let timer;
      try {
        // 서버 조회로 접속을 확인합니다. 테스트 데이터는 추가하지 않습니다.
        await Promise.race([
          db.collection('test_connection').doc('hello_teacher').get({source: 'server'}),
          new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error('연결 확인 시간 초과')), 12000);
          })
        ]);
        onStudentUnlock();
      } catch (err) {
        console.error('입장 연결 확인 실패:', err);
        setError('입장하지 못했습니다. 인터넷 연결을 확인한 후 다시 눌러 주세요. 계속 안 되면 선생님께 알려 주세요.');
      } finally {
        clearTimeout(timer);
        entryBusy.current = false;
        setIsEntering(false);
      }
    };

    return (
      <div className="app-container">
        <h1 style={{color: '#ff9800', margin: '10px 0'}}>🔒 방탈출 입장</h1>
        
        <p>선생님이 알려주신 비밀번호를 입력하세요.</p>
        <input 
          type="password" 
          value={password} 
          onChange={(e) => setPassword(e.target.value)} 
          placeholder="비밀번호 4자리"
        />
        <button disabled={isEntering} onClick={handleStudentSubmit}>
          {isEntering ? '입장 중...' : '입장하기'}
        </button>

        {error && <p style={{color: 'red'}}>{error}</p>}
        
        <div 
          style={{ position: 'absolute', bottom: '15px', right: '15px', color: '#bbb', cursor: 'pointer', fontSize: '12px' }}
          onClick={() => setIsTeacherModalOpen(true)}
        >
          [교사용]
        </div>

        <CustomModal 
          isOpen={isTeacherModalOpen} 
          title="교사 관리자 접속 방지" 
          inputType="password"
          onSubmit={onTeacherUnlock} 
          onClose={() => setIsTeacherModalOpen(false)} 
        />
      </div>
    );
  };

  // --- 3. 학생 로그인 화면 ---
  const StudentLoginScreen = ({ onLogin }) => {
    const [grade, setGrade] = useState('');
    const [studentNum, setStudentNum] = useState('');
    const [name, setName] = useState('');
    const [errorMsg, setErrorMsg] = useState('');

    const handleLogin = () => {
      if (!/^[1-6]$/.test(grade) || !/^\d+$/.test(studentNum) || Number(studentNum) < 1 || !name.trim() || /[\/]/.test(name)) {
        setErrorMsg('학년(1~6), 번호(1 이상), 이름을 확인해 주세요. 이름에 /는 사용할 수 없습니다.');
        return; 
      }
      onLogin({ grade: String(Number(grade)), studentNum: String(Number(studentNum)), name: name.trim() });
    };

    return (
      <div className="app-container">
        <h2>학생 정보 입력</h2>
        <input type="number" placeholder="학년" onChange={(e)=>setGrade(e.target.value)} />
        <input type="number" placeholder="번호" onChange={(e)=>setStudentNum(e.target.value)} />
        <input type="text" placeholder="이름" onChange={(e)=>setName(e.target.value)} />
        <button onClick={handleLogin}>시작하기</button>
        {errorMsg && <p style={{color: 'red', marginTop: '10px'}}>{errorMsg}</p>}
      </div>
    );
  };

  // --- 4. 퀴즈 진행 화면 (Firebase 연동) ---
  const QuizScreen = ({ studentInfo, onQuizFinish, onExit }) => {
    const [currentQ, setCurrentQ] = useState(0);
    const [score, setScore] = useState(0);
    const [isAnswered, setIsAnswered] = useState(false); 
    const [showExplanation, setShowExplanation] = useState(false);
    const [quizFinished, setQuizFinished] = useState(false);
    const [isCorrect, setIsCorrect] = useState(null); 
    const [textInput, setTextInput] = useState(''); 
    const [questionStartTime, setQuestionStartTime] = useState(Date.now());
    const [isSaving, setIsSaving] = useState(false);
    const [saveError, setSaveError] = useState('');
    const [saveMessage, setSaveMessage] = useState('');
    const answerBusy = useRef(false);
    const saveBusy = useRef(false);

    const questionsLow = [
      { id: 1, type: "ox", question: "장애가 있는 사람은 모두 태어날 때부터 장애가 있었다.", choices: ["O", "X"], answerIndex: 1, explanation: "사고나 질병 때문에 살아가면서 장애를 갖게 되는 사람도 많아요.", sourcePage: "PDF 36쪽" },
      { id: 2, type: "ox", question: "주변 환경이 바뀌면 불편한 점이 줄어들 수 있다.", choices: ["O", "X"], answerIndex: 0, explanation: "계단 대신 경사로가 있으면 이동하기 더 쉬워질 수 있어요.", sourcePage: "PDF 29~30쪽" },
      { id: 3, type: "ox", question: "친구가 고르는 데 오래 걸리면 내가 대신 골라 주는 것이 가장 좋다.", choices: ["O", "X"], answerIndex: 1, explanation: "친구가 스스로 고를 수 있도록 기다려 주는 것이 좋아요.", sourcePage: "PDF 53쪽" },
      { id: 4, type: "ox", question: "글이나 그림을 보기 어려운 사람은 소리로 정보를 들을 수도 있다.", choices: ["O", "X"], answerIndex: 0, explanation: "정보는 글뿐 아니라 소리 등 여러 방법으로 알 수 있어요.", sourcePage: "PDF 56~57쪽" },
      { id: 5, type: "ox", question: "장애가 있는 사람은 다른 사람의 도움을 받으면 안 된다.", choices: ["O", "X"], answerIndex: 1, explanation: "누구나 필요할 때 다른 사람의 도움을 받을 수 있어요.", sourcePage: "PDF 86~88쪽" },
      { id: 6, type: "short_choice", question: "휠체어를 타는 사람이 계단 대신 이용하면 좋은 것은?", choices: ["경사로", "높은 문턱", "계단"], answerIndex: 0, explanation: "경사로가 있으면 휠체어를 이용하는 사람도 이동하기 쉬워요.", sourcePage: "PDF 29~30쪽" },
      { id: 7, type: "short_choice", question: "그림을 보기 어려운 사람에게 그림 내용을 알려 주는 좋은 방법은?", choices: ["소리로 설명하기", "그림을 더 작게 하기", "아무것도 알려 주지 않기"], answerIndex: 0, explanation: "그림을 직접 보지 않아도 설명을 들으면서 어떤 그림인지 알 수 있어요.", sourcePage: "PDF 56쪽" },
      { id: 8, type: "short_choice", question: "휠체어가 지나가기 어렵게 만드는 것은?", choices: ["자동문", "높은 문턱", "엘리베이터"], answerIndex: 1, explanation: "높은 문턱은 휠체어 이용하는 사람이 지나가기 어려워요. 휠체어가 문턱에 걸려 앞으로 넘어질 수 있어요.", sourcePage: "PDF 80쪽" },
      { id: 9, type: "scenario_choice", question: "휠체어를 탄 친구가 높은 문턱 때문에 교실에 들어가지 못하고 있어요. 어떻게 하면 좋을까요?", choices: ["친구에게 밖에 있으라 한다.", "문턱을 없애거나 지나가기 쉽게 바꾼다.", "친구를 안고 교실로 들어간다."], answerIndex: 1, explanation: "문턱을 없애거나 경사로를 놔주면 휠체어를 탄 친구도 편하게 교실로 이동할 수 있어요.", sourcePage: "PDF 80쪽" },
      { id: 10, type: "scenario_choice", question: "장애가 있는 친구가 하고 싶은 놀이를 고르고 있어요. 시간이 조금 오래 걸립니다. 어떻게 하면 좋을까요?", choices: ["내가 빨리 대신 골라 준다.", "친구가 고를 때까지 기다리고 필요하면 도와준다.", "친구는 놀이를 하지 못하게 한다."], answerIndex: 1, explanation: "조금 오래 걸리더라도 친구가 스스로 선택할 수 있게 기다려주세요. 친구도 놀이를 선택하고 할 수 있어요.", sourcePage: "PDF 53쪽, 86~88쪽" }
    ];

    const questionsHigh = [
      { id: 1, type: "ox", question: "장애로 인한 어려움은 개인의 몸이나 특성 때문에만 생긴다.", choices: ["O", "X"], answer: "X", explanation: "주변의 시설과 환경에 따라서 어려움이 커지거나 줄어들 수 있습니다.", page: "PDF 29~30쪽" },
      { id: 2, type: "ox", question: "장애가 있는 사람도 자신의 삶과 관련된 일을 스스로 선택하고 결정할 권리가 있다.", choices: ["O", "X"], answer: "O", explanation: "모든 사람은 존중받아야 하며 자신의 삶을 선택하며 살아갈 권리가 있습니다.", page: "PDF 53쪽" },
      { id: 3, type: "choice", question: "우리나라 장애인의 장애 발생 원인으로 더 많은 것은 무엇일까요?", choices: ["사고나 질병 등 후천적인 원인", "태어날 때부터 생긴 원인", "1번 2번이 똑같이 나타난다.", "매년 달라진다."], answer: 0, explanation: "보건복지부에서 조사한 결과로, 우리나라 장애인의 약 88%가 교통사고, 질병 등으로 인한 후천적인 원인으로 장애를 갖게 되었다고 합니다.", page: "PDF 36쪽" },
      { id: 4, type: "choice", question: "휠체어를 사용하는 학생이 계단 때문에 특별실에 갈 수 없습니다. 가장 좋은 해결 방법은 무엇일까요?", choices: ["특별실 수업에서 제외한다.", "친구들이 매번 학생을 들어서 옮긴다.", "이동할 수 있는 경사로나 엘리베이터 등의 환경을 마련한다.", "학생이 계단을 이용할 수 있을 때까지 기다린다."], answer: 2, explanation: "개인에게 어려움을 해결하라고 하기보다 누구나 이용할 수 있도록 환경을 바꾸는 것이 중요합니다.", page: "PDF 29~30쪽" },
      { id: 5, type: "choice", question: "장애가 있다는 이유로 수영장 이용을 거절했습니다. 가장 알맞은 생각은 무엇일까요?", choices: ["안전 사고 예방을 위한 것이니 막아도 된다.", "장애가 있으므로 당연하다.", "장애를 이유로 기회를 막으면 안 된다.", "다른 사람이 동의하면 괜찮다."], answer: 2, explanation: "장애를 이유로 수영장 사용을 막는 것은 '장애인차별금지법' 중 '장애를 이유로 차별하는 것'에 해당합니다. 장애를 이유로 차별하는 것이 아닌 필요한 지원과 이용 방법을 바꿔 장애인도 함께 사용할 수 있어야 합니다.", page: "PDF 54쪽" },
      { id: 6, type: "choice", question: "시각장애인이 인터넷의 사진 정보를 알 수 있게 하는 방법으로 가장 알맞은 것은 무엇일까요?", choices: ["사진을 없앤다.", "사진에 글을 넣어 AI가 읽어줄 수 있게 바꾼다.", "사진은 포기하고 글만 읽게 도와준다.", "시각장애인은 보지 못하니 보여주지 않는다."], answer: 1, explanation: "사진에 대한 설명을 추가하면 프로그램을 통해 AI가 대신 사진을 설명해줘서 시각장애인도 사진을 감상할 수 있습니다.", page: "PDF 56쪽" },
      { id: 7, type: "choice", question: "다음 중 '접근권'에 대한 설명으로 가장 알맞은 것은 무엇일까요?", choices: ["장애인만 특별한 장소를 이용하는 권리", "원하는 장소와 시설, 정보와 서비스를 사용할 수 있게 접근하는 권리", "모든 일을 다른 사람이 대신 해 주는 권리", "장애가 있는 사람만 도움을 받을 권리"], answer: 1, explanation: "접근권은 원하는 장소와 시설을 이용하고 필요한 정보와 서비스에 접근할 수 있는 권리입니다.", page: "PDF 74쪽" },
      { id: 8, type: "choice", question: "처음부터 장애 여부와 관계없이 가능한 많은 사람이 편리하게 이용하도록 만드는 것을 무엇이라고 할까요?", choices: ["배리어프리", "유니버설 디자인", "분리 디자인", "특별 지원"], answer: 1, explanation: "유니버설 디자인은 처음부터 다양한 사람들이 쉽게 이용할 수 있도록 제품이나 환경을 만드는 것입니다.", page: "PDF 79쪽" },
      { id: 9, type: "choice", question: "휠체어의 이동을 막는 높은 문턱을 없애는 것과 가장 관련 있는 말은 무엇일까요?", choices: ["배리어프리", "분리교육", "자립생활", "개인 치료"], answer: 0, explanation: "배리어프리는 생활을 불편하게 하는 물리적·제도적 장벽 등을 없애는 것을 말합니다.", page: "PDF 80쪽" },
      { id: 10, type: "choice", question: "성인이 되면 모두 자신이 원하는 삶을 결정하며 살아갈 수 있게 '자립'합니다. 장애인의 '자립'은 무엇일까요?", choices: ["다른 사람의 도움을 절대 받지 않는 것", "모든 일을 혼자서 해결하는 것", "필요한 도움을 받으면서 자신의 삶을 스스로 선택하고 결정하는 것", "가족이나 선생님이 대신 결정해 주는 것"], answer: 2, explanation: "자립은 모든 일을 혼자 하는 것이 아니라 필요한 지원을 받으면서도 자신의 삶을 선택하고 결정하는 것입니다.", page: "PDF 86~88쪽" }
    ];

    const gradeNum = parseInt(studentInfo.grade, 10);
    const questions = (gradeNum >= 1 && gradeNum <= 3) ? questionsLow : questionsHigh;

    const handleAnswer = (answerValue) => {
      if (answerBusy.current) return;
      answerBusy.current = true;
      setIsAnswered(true);
      
      const correctAns = questions[currentQ].answer !== undefined ? questions[currentQ].answer : questions[currentQ].answerIndex;
      
      let parsedAnswerValue = answerValue;
      if (questions[currentQ].type === 'ox' && typeof correctAns === 'number') {
        parsedAnswerValue = answerValue === 'O' ? 0 : 1;
      }

      const timeTaken = Date.now() - questionStartTime;
      const bonusPoints = Math.max(0, Math.round(50 * (1 - timeTaken / 30000))); 
      const earnedPoints = 50 + bonusPoints; 

      if (parsedAnswerValue === correctAns) {
        setScore(prev => prev + earnedPoints); 
        setIsCorrect(true); 
      } else {
        setIsCorrect(false); 
      }
      setShowExplanation(true);
    };

    const handleNext = async () => {
      if (!answerBusy.current || saveBusy.current) return;
      if (currentQ < questions.length - 1) {
        answerBusy.current = false;
        setIsAnswered(false);
        setShowExplanation(false);
        setIsCorrect(null);
        setTextInput('');
        setQuestionStartTime(Date.now());
        setCurrentQ(prev => prev + 1);
        return;
      }
      saveBusy.current = true;
      setIsSaving(true);
      setSaveError('');
      setSaveMessage('점수를 저장하고 있습니다...');
      const timer = setTimeout(() => setSaveMessage('서버 응답이 늦어지고 있습니다. 화면을 닫지 말고 인터넷 연결을 확인해 주세요. 아직 저장 완료가 확인되지 않았습니다.'), 15000);
      try {
        const docId = `${studentInfo.grade}-${studentInfo.studentNum}-${studentInfo.name}`;
        await db.collection('students').doc(docId).set({
          grade: studentInfo.grade,
          studentNum: studentInfo.studentNum,
          name: studentInfo.name,
          score: score,
          isQuizDone: true,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }, {merge: true});
        setQuizFinished(true);
      } catch (err) {
        console.error('퀴즈 저장 실패:', err);
        setSaveError('점수 저장에 실패했습니다. 아래 내용을 선생님께 보여 주세요.\n' + describeError(err));
      } finally {
        clearTimeout(timer);
        saveBusy.current = false;
        setIsSaving(false);
        setSaveMessage('');
      }
    };

    if (quizFinished) {
      return (
        <div className="app-container">
          <h2>🎉 퀴즈 완료! 🎉</h2>
          <h1 style={{fontSize: '50px', color: '#4CAF50', margin: '10px 0'}}>{score}점</h1>
          <p>✅ 점수가 서버에 저장되었습니다.</p><p>수고하셨습니다. 이제 이름을 지으러 가볼까요?</p>
          <button style={{padding: '15px 30px', fontSize: '18px'}} onClick={() => onQuizFinish(score)}>
            메인 메뉴로 돌아가기
          </button>
        </div>
      );
    }

    const q = questions[currentQ];

    return (
      <div className="app-container">
        <div style={{ width: '100%', textAlign: 'left', marginBottom: '10px' }}>
          <button style={{ backgroundColor: '#9e9e9e', padding: '8px 12px', fontSize: '14px', margin: '0' }} disabled={isSaving} onClick={onExit}>
            🔙 메인 화면
          </button>
        </div>

        <h3 style={{color: '#2196F3', margin: '0 0 10px 0'}}>장애이해교육 퀴즈 ({currentQ + 1}/{questions.length})</h3>
        <h2 style={{margin: '20px 0', minHeight: '80px', wordBreak: 'keep-all'}}>{q.id}. {q.question}</h2>
        
        {q.type === 'ox' ? (
          <div style={{display: 'flex', justifyContent: 'center', gap: '20px', marginBottom: '20px'}}>
            <button 
              style={{fontSize: '50px', width: '120px', height: '120px', backgroundColor: '#4CAF50', margin: '0'}} 
              onClick={() => handleAnswer('O')}
              disabled={isAnswered}
            >O</button>
            <button 
              style={{fontSize: '50px', width: '120px', height: '120px', backgroundColor: '#F44336', margin: '0'}} 
              onClick={() => handleAnswer('X')}
              disabled={isAnswered}
            >X</button>
          </div>
        ) : (
          <div style={{display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '20px'}}>
            {q.choices.map((choice, idx) => (
              <button 
                key={idx}
                style={{
                  fontSize: '16px', 
                  padding: '15px', 
                  backgroundColor: 'white',   
                  color: '#333',              
                  border: '1px solid #ccc',   
                  margin: '0', 
                  textAlign: 'left'
                }} 
                onClick={() => handleAnswer(idx)}
                disabled={isAnswered}
              >
                {idx + 1}. {choice}
              </button>
            ))}
          </div>
        )}

        {showExplanation && (
          <div style={{
            padding: '15px', 
            backgroundColor: isCorrect ? '#e8f5e9' : '#ffebee', 
            borderRadius: '8px', 
            marginTop: '10px'
          }}>
            <h3 style={{color: isCorrect ? '#388E3C' : '#D32F2F', margin: '0 0 10px 0'}}>
              {isCorrect ? '🎉 정답입니다!' : '🥲 아쉽지만 틀렸어요.'}
            </h3>
            <p style={{fontSize: '16px', fontWeight: 'bold', color: '#333', margin: '0 0 10px 0'}}>
              올바른 정답: {
                q.type === 'ox' ? (q.answer !== undefined ? q.answer : q.choices[q.answerIndex]) 
                : q.choices[q.answerIndex !== undefined ? q.answerIndex : q.answer] 
              }
            </p>
            <p style={{margin: '0 0 15px 0', wordBreak: 'keep-all'}}>{q.explanation}</p>
            <button disabled={isSaving} style={{width: '90%'}} onClick={handleNext}>
              {isSaving ? '저장 중...' : saveError ? '점수 저장 다시 시도' : currentQ < questions.length - 1 ? '다음 문제로 넘어가기' : '결과 저장하고 보기'}
            </button>
          </div>
        )}
        <p role="status">{saveMessage}</p>
        <ErrorNotice message={saveError} />
      </div>
    );
  };

  // --- 5. 학생 공모전 화면 (Firebase 연동) ---
  const ContestScreen = ({ studentInfo, onBack }) => {
    const [newName, setNewName] = useState('');
    const [reason, setReason] = useState('');
    const [errorText, setErrorText] = useState('');
    const [isEditLocked, setIsEditLocked] = useState(false);
    const [isLoading, setIsLoading] = useState(true);
    const [loadError, setLoadError] = useState('');
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [reloadKey, setReloadKey] = useState(0);
    const submitBusy = useRef(false);

    const docId = `${studentInfo.grade}-${studentInfo.studentNum}-${studentInfo.name}`;

    useEffect(() => {
      setIsLoading(true);
      setLoadError('');
      db.collection('submissions').doc(docId).get({source:'server'}).then(doc => {
        if (doc.exists) {
          const data = doc.data();
          setNewName(data.newName || '');
          setReason(data.reason || '');
          setIsEditLocked(data.isLocked);
        }
        setIsLoading(false);
      }).catch(err => {
        console.error("데이터 로딩 에러:", err);
        setLoadError(describeError(err));
        setIsLoading(false);
      });
    }, [docId, reloadKey]);

    const handleSubmit = () => {
      if (submitBusy.current || loadError || isEditLocked) return;
      if (!newName.trim() || !reason.trim()) {
        setErrorText('이름과 이유를 모두 적어주세요! 🚨');
        return;
      }
      setErrorText('');
      submitBusy.current = true;
      setIsSubmitting(true);
      
      db.collection('submissions').doc(docId).set({
        grade: studentInfo.grade,
        studentNum: studentInfo.studentNum,
        name: studentInfo.name,
        newName: newName.trim(),
        reason: reason.trim(),
        isLocked: true,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        setIsEditLocked(true);
        alert('성공적으로 제출되었습니다!');
      }).catch(err => {
        console.error("데이터 저장 에러:", err);
        setErrorText(describeError(err));
      }).finally(() => { submitBusy.current = false; setIsSubmitting(false); });
    };

    if (loadError) {
      return <div className="app-container"><h2>제출 내역을 불러오지 못했습니다.</h2><ErrorNotice message={loadError}/><button onClick={() => setReloadKey(v => v + 1)}>다시 불러오기</button><button disabled={isSubmitting} onClick={onBack}>메인 화면</button></div>;
    }
    if (isLoading) {
      return <div className="app-container"><p>잠시만 기다려주세요...</p></div>;
    }

    return (
      <div className="app-container">
        <div style={{ width: '100%', textAlign: 'left', marginBottom: '10px' }}>
          <button style={{ backgroundColor: '#9e9e9e', padding: '8px 12px', fontSize: '14px', margin: '0' }} disabled={isSubmitting} onClick={onBack}>
            🔙 메인 화면
          </button>
        </div>

        <h2 style={{color: '#9c27b0'}}>✨ 특수학급 새 이름 짓기 ✨</h2>
        <input 
          type="text" 
          placeholder="변경할 이름 (예: 해오름반)" 
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          disabled={isEditLocked || isSubmitting}
        />
        <textarea 
          rows="4"
          placeholder="그렇게 생각한 이유를 적어주세요."
          value={reason}
          onChange={(e) => setReason(e.target.value)}
          disabled={isEditLocked || isSubmitting}
        />
        <ErrorNotice message={errorText} />
        
        {isEditLocked ? (
          <p style={{color: 'gray', fontWeight: 'bold'}}>✅ 제출 완료 (선생님이 확인 후 수정할 수 있습니다.)</p>
        ) : (
          <button disabled={isSubmitting} style={{width: '90%', padding: '15px'}} onClick={handleSubmit}>{isSubmitting ? '제출 중... 화면을 닫지 마세요' : '제출하기'}</button>
        )}
      </div>
    );
  };

  // --- 6. 메인 컨트롤러 ---
  const App = () => {
    const [view, setView] = useState('lock'); 
    const [studentInfo, setStudentInfo] = useState(null);
    const [hasPlayedQuiz, setHasPlayedQuiz] = useState(false); 
    const [menuError, setMenuError] = useState(''); 

    if (view === 'lock') {
      return (
        <AppLockScreen 
          onStudentUnlock={() => setView('login')} 
          onTeacherUnlock={() => setView('teacher_dummy')} 
        />
      );
    }
    
    if (view === 'login') {
      return <StudentLoginScreen onLogin={(info) => { setStudentInfo(info); setView('menu'); }} />;
    }

    if (view === 'menu') {
      return (
        <div className="app-container">
          <h2>환영합니다! {studentInfo.name} 학생 🎉</h2>
          <div style={{marginTop: '20px'}}>
            <button 
              style={{width: '90%', padding: '20px', fontSize: '18px', backgroundColor: '#2196F3'}} 
              onClick={() => setView('quiz')}
            >
              1. 장애이해교육 퀴즈 풀기
            </button>
            <br/>
            <button 
              style={{
                width: '90%', 
                padding: '20px', 
                fontSize: '18px', 
                backgroundColor: hasPlayedQuiz ? '#9c27b0' : '#ccc',
                cursor: hasPlayedQuiz ? 'pointer' : 'not-allowed',
                marginTop: '15px'
              }} 
              onClick={() => {
                if(hasPlayedQuiz) {
                  setMenuError('');
                  setView('contest');
                } else {
                  setMenuError('앗! 퀴즈를 먼저 끝까지 풀어주세요! 🚨');
                }
              }}
            >
              2. 특수학급 새 이름 짓기 {hasPlayedQuiz ? '✨' : '🔒'}
            </button>
            {menuError && <p style={{color: 'red', marginTop: '15px', fontWeight: 'bold'}}>{menuError}</p>}
            
            <hr style={{border: '0', height: '1px', backgroundColor: '#eee', margin: '30px 0 20px 0'}}/>

            <button 
              style={{
                width: '90%', 
                padding: '15px', 
                fontSize: '16px', 
                backgroundColor: '#ff9800', 
                margin: '0 auto'
              }} 
              onClick={() => {
                setStudentInfo(null);
                setHasPlayedQuiz(false);
                setMenuError('');
                setView('login');
              }}
            >
              🔄 다른 학생 정보 입력하기 (처음으로)
            </button>
          </div>
        </div>
      );
    }

    if (view === 'quiz') {
      return (
        <QuizScreen 
          studentInfo={studentInfo} 
          onQuizFinish={(score) => {
            setHasPlayedQuiz(true);
            setView('menu');
          }} 
          onExit={() => setView('menu')} 
        />
      );
    }

    if (view === 'contest') {
      return (
        <ContestScreen 
          studentInfo={studentInfo} 
          onBack={() => setView('menu')} 
        />
      );
    }

    if (view === 'teacher_dummy') {
      return (
        <div className="app-container">
          <h2>👨‍🏫 교사 대시보드 접근 방지</h2>
          <p>교사용 관리자 화면은 배포된 별도의 링크를 사용하세요.</p>
          <button onClick={() => setView('lock')}>처음으로 돌아가기</button>
        </div>
      )
    }

    return null;
  };

  // React 실행
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
